<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TicTacToe — Mój pierwszy projekt</title>
    <link rel="stylesheet" href="../landing.css" />
  </head>
  <body>
    <div class="container">
      <header>
  <a href="../../index.html">← Powrót</a>
        <span>TicTacToe — mój pierwszy projekt</span>
      </header>

  <h1><img class="proj-icon" src="../../icons/TicTacToeIcon.png" alt=""/>TicTacToe — mój pierwszy projekt</h1>

      <!-- Galeria u góry -->
      <section class="panel panel--lg">
        <div class="gallery">
          <figure style="width:100%">
            <div id="live-ttt"></div>
            <figcaption>Interaktywny podgląd gry</figcaption>
          </figure>
        </div>
      </section>

      <!-- Opis pod galerią -->
      <section class="panel">
        <h2 class="accent">Cel aplikacji</h2>
        <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Integer vel orci vitae justo rhoncus porta.</p>
      </section>

      <!-- Dół: 2 kolumny -->
      <section class="columns">
        <div class="panel">
          <h2 class="accent">Technologie</h2>
          <div class="skills-grid">
            <span class="skill-badge">HTML</span>
            <span class="skill-badge">CSS</span>
            <span class="skill-badge">JavaScript</span>
          </div>
        </div>
        <div class="panel">
          <h2 class="accent">Plan rozwoju</h2>
          <ul class="roadmap">
            <li class="done">Tryb lokalny</li>
            <li class="wip">Prosty AI przeciwnik</li>
            <li>Gra online</li>
          </ul>
        </div>
      </section>
    </div>
    <script>
      (function(){
        const paths = [
          '../components/tictactoe/tictactoe.js',
          '../../public/components/tictactoe/tictactoe.js',
          '../../components/tictactoe/tictactoe.js',
          './components/tictactoe/tictactoe.js',
          '/portf/components/tictactoe/tictactoe.js',
          '/components/tictactoe/tictactoe.js'
        ];
        function load(i){
          if(i>=paths.length){ console.error('TicTacToe: nie udało się załadować skryptu komponentu'); return; }
          var s=document.createElement('script');
          s.src=paths[i];
          s.onload=function(){
            if(window.TicTacToeComponent){ window.TicTacToeComponent.mount('#live-ttt'); }
          };
          s.onerror=function(){ s.remove(); load(i+1); };
          document.body.appendChild(s);
        }
        load(0);
      })();
    </script>
  </body>
  </html>
